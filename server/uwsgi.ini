[uwsgi]
project = maptroid
uid = django
base = /home/%(uid)/projects/%(project)/server

chdir = %(base)
virtualenv = %(base)/.venv
module = main.wsgi:application

master = true
processes = 1

http = 127.0.0.1:8943

safe-pidfile = /tmp/%(project).pid

; Recycle workers to cap memory on this shared, memory-pressured box. A single
; worker here reached ~390 MB over three months untouched, and ~160 MB over the
; two weeks after that — a slow Django leak, not a spike.
; 250, not the 120 the backlog doc suggested: a healthy worker here plateaus at
; ~115 MB, so 120 would recycle on normal request variation instead of on the
; leak. 250 still fires well before the ~390 MB this reached when left alone.
max-requests = 500           ; recycle a worker after 500 requests
reload-on-rss = 250          ; recycle a worker that exceeds 250 MB

; touch this file to gracefully reload workers
touch-reload = %(base)/uwsgi.ini
