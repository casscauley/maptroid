[uwsgi]
project = maptroid
uid = clepsy
base = /home/%(uid)/projects/%(project)/server

chdir = %(base)
virtualenv = %(base)/.venv
module = main.wsgi:application

master = true
processes = 1
; REQUIRED by the systemd unit, and the only ini on this box that was missing
; it. Without die-on-term uwsgi reads SIGTERM as "brutal reload" rather than
; shutdown: `systemctl stop` hangs until timeout, and an attempt to stop this
; process to hand :8943 over to systemd instead just reloaded it in place,
; leaving the unit crash-looping on a port it could never bind.
die-on-term = true
vacuum = true

http = 127.0.0.1:8943

safe-pidfile = /tmp/%(project).pid

; Recycle workers to cap memory on this shared, memory-pressured box. A single
; worker here reached ~390 MB over three months untouched, and ~160 MB over the
; two weeks after that — a slow Django leak, not a spike.
; 250, not the 120 the backlog doc suggested: a healthy worker here plateaus at
; ~115 MB, so 120 would recycle on normal request variation instead of on the
; leak. 250 still fires well before the ~390 MB this reached when left alone.
max-requests = 500           ; recycle a worker after 500 requests
reload-on-rss = 250          ; recycle a worker that exceeds 250 MB

; touch this file to gracefully reload workers
touch-reload = %(base)/uwsgi.ini

; Request and error log. logto silences stdout, so `journalctl -u <unit>` shows
; unit lifecycle only and requests land here. log-reopen makes uwsgi reopen the
; file after logrotate moves it, instead of writing to the rotated-away inode.
logto = /home/clepsy/projects/maptroid/logs/uwsgi.log
log-reopen = true
